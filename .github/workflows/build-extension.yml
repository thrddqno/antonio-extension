name: Build Chrome extension

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Verify extension package
        run: npm run test:extension

      - name: Package extension files
        run: zip -r new-tab-extension.zip .
        working-directory: dist

      - name: Upload extension files
        uses: actions/upload-artifact@v4
        with:
          name: new-tab-extension
          path: dist/new-tab-extension.zip
          if-no-files-found: error
          retention-days: 30
